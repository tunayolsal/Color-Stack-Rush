<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Chroma Hole app icon - procedural source (see also icon-1024.png export) -->
  <defs>
    <radialGradient id="void" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="78%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#12121E"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="100%" stop-color="#F0E9D8"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" rx="228" fill="url(#vignette)"/>

  <!-- spiral color arcs being sucked into the hole -->
  <g fill="none" stroke-linecap="round" transform="rotate(-14 512 512)">
    <path d="M 512 92  A 420 420 0 0 1 932 512" stroke="#FF5C5C" stroke-width="88"/>
    <path d="M 932 512 A 420 420 0 0 1 512 932" stroke="#FFD93D" stroke-width="88"/>
    <path d="M 512 932 A 420 420 0 0 1 92 512"  stroke="#4D96FF" stroke-width="88"/>
    <path d="M 92 512  A 420 420 0 0 1 512 92"  stroke="#6BCB77" stroke-width="88"/>
  </g>
  <g fill="none" stroke-linecap="round" transform="rotate(30 512 512)">
    <path d="M 512 212 A 300 300 0 0 1 812 512" stroke="#B983FF" stroke-width="72"/>
    <path d="M 812 512 A 300 300 0 0 1 512 812" stroke="#FF5C5C" stroke-width="72"/>
    <path d="M 512 812 A 300 300 0 0 1 212 512" stroke="#FFD93D" stroke-width="72"/>
    <path d="M 212 512 A 300 300 0 0 1 512 212" stroke="#4D96FF" stroke-width="72"/>
  </g>

  <!-- swallowed blobs trailing in -->
  <circle cx="784" cy="286" r="34" fill="#6BCB77"/>
  <circle cx="238" cy="742" r="26" fill="#FF5C5C"/>
  <circle cx="292" cy="266" r="22" fill="#FFD93D"/>

  <!-- the hole -->
  <circle cx="512" cy="512" r="252" fill="url(#void)"/>
  <circle cx="512" cy="512" r="252" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="10"/>

  <!-- inner swirl highlight -->
  <g fill="none" stroke="#B983FF" stroke-opacity="0.55" stroke-width="26" stroke-linecap="round">
    <path d="M 512 356 A 156 156 0 0 1 668 512"/>
    <path d="M 512 668 A 156 156 0 0 1 356 512"/>
  </g>
  <g fill="none" stroke="#4D96FF" stroke-opacity="0.5" stroke-width="20" stroke-linecap="round">
    <path d="M 512 424 A 88 88 0 0 1 600 512"/>
    <path d="M 512 600 A 88 88 0 0 1 424 512"/>
  </g>
</svg>

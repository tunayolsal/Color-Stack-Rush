<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#15132b">
  <meta name="description" content="Color Stack Rush: Aynı rengi topla, engellerden kaç ve bitmeyen bölüm yolculuğuna tarayıcından katıl.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Color Stack Rush · Oyna</title>
  <style>
    * { box-sizing:border-box; }
    html,body { width:100%;height:100%;margin:0;overflow:hidden;background:#15132b;color:#fff;font-family:system-ui,sans-serif; }
    body { --available-width:calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right));--available-height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));display:grid;place-items:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #game { position:relative; width:min(var(--available-width),calc(var(--available-height) * .5625));height:min(var(--available-height),calc(var(--available-width) * 1.777778));overflow:hidden;background:#f2e9ff;border-radius:20px;box-shadow:0 24px 100px #0007; }
    canvas { display:block;width:100%;height:100%;touch-action:none;outline:none; }
    #game:fullscreen { width:100vw;height:100dvh;display:grid;place-items:center;border-radius:0;background:#15132b;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #game:fullscreen canvas { width:min(var(--available-width),calc(var(--available-height) * .5625));height:min(var(--available-height),calc(var(--available-width) * 1.777778)); }
    #cover { position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;text-align:center;padding:30px;background:linear-gradient(155deg,#f7efff,#e9f8ff);color:#24203e; }
    #cover h1 { font-size:clamp(28px,8vw,46px);line-height:1.05;margin:0;font-weight:900;letter-spacing:-2px; }
    #cover p { margin:0;max-width:26ch;line-height:1.5; }
    button { border:0;border-radius:999px;background:#7658e5;color:#fff;font:700 17px system-ui;padding:15px 35px;cursor:pointer;box-shadow:0 8px 20px #7658e530;touch-action:manipulation; }
    button:disabled { opacity:.6;cursor:wait; }
    #progress { width:75%;height:8px;appearance:none;border:0;border-radius:8px;overflow:hidden; }
    #progress::-webkit-progress-bar { background:#ddd5ef; }
    #progress::-webkit-progress-value { background:#7658e5; }
    #progress::-moz-progress-bar { background:#7658e5; }
    #fullscreen { position:absolute;right:12px;bottom:12px;z-index:2;padding:8px 13px;font-size:12px;background:#24203eaa;box-shadow:none; }
    #status { min-height:3em;font-size:14px; }
    [hidden] { display:none !important; }
    @media (max-width:600px) { #game { border-radius:0;box-shadow:none; } }
  </style>
</head>
<body>
  <main id="game">
    <canvas id="unity-canvas" width="540" height="960" tabindex="0" aria-label="Color Stack Rush oyun alanı"></canvas>
    <section id="cover" aria-live="polite">
      <h1>COLOR<br>STACK RUSH</h1>
      <p>Aynı rengi topla.<br>Bölümleri geç, ritmi yakala.</p>
      <progress id="progress" max="1" value="0"></progress>
      <p id="status">Oyun hazırlanıyor · %0</p>
      <button id="retry" hidden>Yeniden yükle</button>
    </section>
    <button id="fullscreen" hidden aria-label="Tam ekran">Tam ekran</button>
  </main>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const cover = document.getElementById('cover');
    const status = document.getElementById('status');
    const progress = document.getElementById('progress');
    const retry = document.getElementById('retry');
    const fullscreen = document.getElementById('fullscreen');
    let player;
    let bootFailed = false;
    function showError(message) {
      bootFailed = true;
      console.error(message);
      status.textContent = 'Oyun yüklenemedi. Bağlantını kontrol edip yeniden dene.';
      retry.hidden = false;
      progress.hidden = true;
      cover.hidden = false;
    }
    retry.addEventListener('click', () => location.reload());
    const mobile = matchMedia('(pointer:coarse)').matches;
    const config = {
      dataUrl: 'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: 'Build/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: 'Color Stack Rush',
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      matchWebGLToCanvasSize: true,
      devicePixelRatio: mobile ? 1 : Math.min(window.devicePixelRatio || 1, 1.5),
      autoSyncPersistentDataPath: false,
      csrStorageError: message => {
        showError(message);
        status.textContent = 'Tarayıcı kayıtları açılamadı. Yeniden yükleyip tekrar dene.';
      },
      showBanner: (message,type) => { if (type === 'error') showError(message); else console.warn(message); }
    };
    const loader = document.createElement('script');
    loader.src = 'Build/{{{ LOADER_FILENAME }}}';
    loader.onerror = () => showError('Loader unavailable');
    loader.onload = () => createUnityInstance(canvas,config,value => {
      if (bootFailed) return;
      progress.value = value;
      status.textContent = 'Oyun hazırlanıyor · %' + Math.round(value * 100);
    }).then(instance => {
      player = instance;
      if (bootFailed) return;
      progress.hidden = true;
      cover.hidden = true;
      canvas.focus();
      fullscreen.hidden = !document.fullscreenEnabled;
    }).catch(showError);
    document.body.appendChild(loader);
    // A genuine pointer event resumes Web Audio, including after returning to the tab.
    canvas.addEventListener('pointerdown', () => window.colorStackRush?.unlockAudio?.(), {passive:true});
    fullscreen.addEventListener('click', () => {
      window.colorStackRush?.unlockAudio?.();
      document.getElementById('game').requestFullscreen?.().catch(console.warn);
    });
    document.addEventListener('contextmenu',event => { if(event.target === canvas) event.preventDefault(); });
    canvas.addEventListener('touchmove',event => event.preventDefault(),{passive:false});
  </script>
</body>
</html>
